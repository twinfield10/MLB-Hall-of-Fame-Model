name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Parse every R file
        shell: Rscript {0}
        run: |
          fs <- list.files(".", "\\.[Rr]$", recursive = TRUE)
          for (f in fs) {
            tryCatch(parse(f), error = function(e) stop(f, ": ", conditionMessage(e), call. = FALSE))
          }
          cat(length(fs), "R files parsed OK\n")
